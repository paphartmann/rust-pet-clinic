name: OWASP ZAP scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U petclinic -d petclinic > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://petclinic:petclinic@127.0.0.1:5432/petclinic
        run: |
          for attempt in {1..10}; do
            if sqlx migrate run; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build and start app
        env:
          DATABASE_URL: postgres://petclinic:petclinic@127.0.0.1:5432/petclinic
          DATABASE_MAX_CONNECTIONS: "5"
        run: |
          cargo run &

      - name: Wait for application to respond
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application is not responding on http://127.0.0.1:3000/health"
          exit 1

      - name: Run OWASP ZAP
        run: |
          mkdir -p zap-work
          chmod 777 zap-work
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-work:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:3000 \
            -J zap_report.json \
            -w zap_report.md \
            -r zap_report.html || test $? -le 2

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-work/zap_report.html
            zap-work/zap_report.json
            zap-work/zap_report.md
          if-no-files-found: warn
