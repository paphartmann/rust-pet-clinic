[package]
name = "rust-petclinic"
version = "0.1.0"
edition = "2024"

[dependencies]

axum = "0.8.6"
tokio = { version = "1.48", features = ["full"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dotenvy = "0.15.7"
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
