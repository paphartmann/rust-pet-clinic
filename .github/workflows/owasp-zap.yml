name: OWASP ZAP scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U petclinic -d petclinic > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://petclinic:petclinic@127.0.0.1:5432/petclinic
        run: |
          for attempt in {1..10}; do
            if sqlx migrate run; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build and start app
        env:
          DATABASE_URL: postgres://petclinic:petclinic@127.0.0.1:5432/petclinic
          DATABASE_MAX_CONNECTIONS: "5"
        run: |
          cargo build --release
          cargo run --release > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to respond
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application is not responding on http://127.0.0.1:3000/health"
          cat app.log || true
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://host.docker.internal:3000"
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
